<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escala Ministerial</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            "navy": "#1e3a8a",
            "mint": "#2dd4bf",
            "dark-bg": "#0a0f18",
            "dark-surface": "#111b27",
            "surface": "#ffffff",
            "background": "#f9fafb",
            "primary": "#1e3a8a",
          },
          fontFamily: {
            "sans": ["Inter", "sans-serif"]
          },
          borderRadius: {
            "3xl": "24px",
            "4xl": "32px",
          }
        }
      }
    }
  </script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
      background-color: #0a0f18; /* Default dark */
    }
    .dark body {
      background-color: #0a0f18;
    }
    .light body {
      background-color: #f7f5f8;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    .material-symbols-fill {
      font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    input:focus {
      border-color: #1eff9d !important;
      box-shadow: 0 0 0 2px rgba(30, 255, 157, 0.1) !important;
    }
  </style>
<script type="importmap">
{

    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-white antialiased transition-colors duration-200">
